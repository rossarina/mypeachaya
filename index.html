<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Happy Birthday! my baby little meow">
    <title>Happy Birthday! 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cursor Trail Canvas -->
    <canvas id="trailCanvas"></canvas>

    <!-- Background Audio -->
    <audio id="bgMusic" src="assets/music/song.mp3" loop></audio>

    <!-- Balloon Container (populated by JS) -->
    <div id="balloon-container"></div>

    <!-- ============================================================
         QUIZ OVERLAY
         แก้ไขคำถามและคำตอบได้ตรงนี้เลยครับ 👇
    ============================================================ -->
    <div id="quizOverlay" class="quiz-overlay">
        <!-- ดาวและหัวใจประดับรอบๆ -->
        <div class="quiz-deco d1">🌸</div>
        <div class="quiz-deco d2">💕</div>
        <div class="quiz-deco d3">✨</div>
        <div class="quiz-deco d4">🌸</div>
        <div class="quiz-deco d5">💫</div>
        <div class="quiz-deco d6">🦋</div>

        <div class="quiz-card">
            <div class="quiz-top-emoji">💌</div>

            <h2 class="quiz-title">ก่อนเปิดของขวัญ...</h2>
            <p class="quiz-subtitle">ตอบคำถามนี้ให้ถูกก่อนนะ 🥰</p>

            <!-- =========================================
                 🔧 เปลี่ยนคำถามตรงนี้ 👇
            ========================================= -->
            <p class="quiz-question" id="quizQuestion">
                "วันนี้วันเกิดใครน้า?"
            </p>

            <input type="text" id="quizInput" class="quiz-input" placeholder="พิมพ์คำตอบตรงนี้เลย..." autocomplete="off"
                spellcheck="false">

            <p id="quizFeedback" class="quiz-feedback"></p>

            <button id="quizSubmit" class="quiz-submit-btn">
                ตรวจคำตอบ 💖
            </button>
        </div>
    </div>


    <!-- Floating Photos (Jigsaw) -->
    <div id="photo-container">
        <div class="floating-photo" style="background-image: url('assets/images/pic1.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic2.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic3.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic4.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic5.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic6.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic7.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic8.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic9.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic10.jpg');"></div>
        <div class="floating-photo" style="background-image: url('assets/images/pic11.jpg');"></div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Gift Box -->
        <div class="gift-box" id="giftBox">
            <div class="gift-lid"></div>
            <div class="gift-body">
                <div class="gift-ribbon-vertical"></div>
                <div class="gift-ribbon-horizontal"></div>
            </div>
            <!-- Sparkle dots around gift box -->
            <div class="sparkle s1">✦</div>
            <div class="sparkle s2">✦</div>
            <div class="sparkle s3">✦</div>
            <div class="sparkle s4">✦</div>
            <div class="sparkle s5">✦</div>
            <div class="gift-text">คลิกเพื่อเปิดของขวัญ 🎁</div>
        </div>

        <!-- Birthday Message Card (Hidden by default) -->
        <div class="message-card hidden" id="messageCard">
            <div class="message-inner">
                <h1 id="hbd-title"></h1>
                <p id="hbd-desc">ขอให้อ้วนมีความสุขมากๆ สุขภาพแข็งแรงนะคะ เติบโตไปเป็นผู้ใหญ่ที่ดี มีแต่คนรัก
                    เป็นความสุขให้กับทุกๆคนนะคะ 💕<br>รักคิมหมดหัวใจเลยยยย ✨</p>

                <!-- Send Love Button -->
                <button class="love-btn" id="loveBtn">💖 ส่งรัก</button>
            </div>
        </div>
    </div>

    <!-- UI Controls (top-right corner) -->
    <div class="ui-controls">
        <!-- Music Toggle -->
        <button class="ctrl-btn" id="musicBtn" title="เปิด/ปิดเพลง">🔇</button>
        <!-- Confetti Button -->
        <button class="ctrl-btn" id="confettiBtn" title="ยิงพลุ!">🎉</button>
    </div>

    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
